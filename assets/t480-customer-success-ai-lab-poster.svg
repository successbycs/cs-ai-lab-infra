<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2200" viewBox="0 0 1200 2200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06182f"/><stop offset=".52" stop-color="#064563"/><stop offset="1" stop-color="#071f3c"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#104a68"/><stop offset="1" stop-color="#082a45"/></linearGradient>
    <linearGradient id="strong" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#086f82"/><stop offset="1" stop-color="#174c88"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#00111f" flood-opacity=".45"/></filter>
    <style>.title{font-family:Ubuntu,DejaVu Sans,sans-serif;font-weight:800;fill:#f8fcff;letter-spacing:1px}.h{font-family:Ubuntu,DejaVu Sans,sans-serif;font-weight:700;fill:#f8fcff}.p{font-family:Ubuntu,DejaVu Sans,sans-serif;font-weight:400;fill:#c8e4ef}.small{font-family:Ubuntu,DejaVu Sans,sans-serif;font-weight:500;fill:#afd4e3}.teal{font-family:Ubuntu,DejaVu Sans,sans-serif;font-weight:800;fill:#68f2e1}.tag{font-family:Ubuntu,DejaVu Sans,sans-serif;font-weight:800;fill:#062236;letter-spacing:.5px}</style>
  </defs>
  <rect width="1200" height="2200" fill="url(#bg)"/>
  <path d="M0 220h150l35 35h125M1200 250h-160l-35 35H860M0 750h130l45-45h145M1200 760h-140l-45-45H870M0 1450h150l35 35h125M1200 1460h-160l-35 35H860M0 2050h150l35-35h125M1200 2050h-160l-35-35H860" fill="none" stroke="#1a7491" stroke-width="3" opacity=".55"/>

  <rect x="60" y="50" width="1080" height="160" rx="30" fill="#072840" stroke="#45e1d2" stroke-width="2"/>
  <text x="96" y="118" class="title" font-size="56">CUSTOMER SUCCESS AI LAB</text>
  <text x="98" y="162" class="small" font-size="24">Private local AI infrastructure for building, evaluating and governing Customer Success workflows</text>

  <rect x="60" y="245" width="1080" height="305" rx="28" fill="#082c46" stroke="#2c9aae" stroke-width="2" filter="url(#shadow)"/>
  <text x="100" y="301" class="teal" font-size="19">THE MISSION</text>
  <text x="100" y="352" class="h" font-size="34">Turn a modest T480 into a safe,</text>
  <text x="100" y="396" class="h" font-size="34">repeatable proving ground for</text>
  <text x="100" y="440" class="h" font-size="34">Customer Success AI.</text>
  <rect x="100" y="468" width="580" height="48" rx="20" fill="#0d5c70"/><text x="124" y="500" class="p" font-size="19">Experiment locally • keep decisions human-led</text>
  <rect x="776" y="267" width="304" height="258" rx="20" fill="#071b33" stroke="#62e9dc" stroke-width="3"/>

  <rect x="60" y="585" width="1080" height="225" rx="28" fill="#092e49" stroke="#2a84a0" stroke-width="2"/>
  <text x="96" y="638" class="title" font-size="28">HOW THE PLATFORM FITS TOGETHER</text>
  <path d="M170 720H1030" stroke="#64eadd" stroke-width="4" opacity=".8"/>
  <g><circle cx="170" cy="720" r="54" fill="#0b5670" stroke="#72eee0" stroke-width="3"/><text x="170" y="714" class="h" font-size="20" text-anchor="middle">T16</text><text x="170" y="741" class="small" font-size="14" text-anchor="middle">Build + govern</text></g>
  <g><circle cx="430" cy="720" r="54" fill="#0b5670" stroke="#72eee0" stroke-width="3"/><text x="430" y="714" class="h" font-size="20" text-anchor="middle">GIT</text><text x="430" y="741" class="small" font-size="14" text-anchor="middle">Versioned config</text></g>
  <g><circle cx="700" cy="720" r="54" fill="#0b5670" stroke="#72eee0" stroke-width="3"/><text x="700" y="714" class="h" font-size="20" text-anchor="middle">T480</text><text x="700" y="741" class="small" font-size="14" text-anchor="middle">Private runtime</text></g>
  <g><circle cx="1030" cy="720" r="54" fill="#0b5670" stroke="#72eee0" stroke-width="3"/><text x="1030" y="714" class="h" font-size="18" text-anchor="middle">CS APPS</text><text x="1030" y="741" class="small" font-size="14" text-anchor="middle">Reusable solutions</text></g>

  <rect x="60" y="845" width="1080" height="420" rx="28" fill="#082b46" stroke="#2a84a0" stroke-width="2"/>
  <text x="96" y="900" class="title" font-size="29">CORE PLATFORM CAPABILITIES</text>
  <g filter="url(#shadow)">
    <rect x="94" y="930" width="480" height="135" rx="20" fill="url(#card)" stroke="#347e9b"/><circle cx="142" cy="978" r="25" fill="#186587"/><text x="142" y="983" class="h" font-size="13" text-anchor="middle">FLOW</text><text x="184" y="970" class="h" font-size="23">n8n workflow automation</text><text x="184" y="1000" class="p" font-size="16">Schedules, integrations, approvals and bounded tests.</text>
    <rect x="626" y="930" width="480" height="135" rx="20" fill="url(#card)" stroke="#347e9b"/><circle cx="674" cy="978" r="25" fill="#186587"/><text x="674" y="983" class="h" font-size="14" text-anchor="middle">DB</text><text x="716" y="970" class="h" font-size="23">PostgreSQL + pgvector</text><text x="716" y="1000" class="p" font-size="16">Structured context, metadata and vector search.</text>
    <rect x="94" y="1090" width="480" height="135" rx="20" fill="url(#card)" stroke="#347e9b"/><circle cx="142" cy="1138" r="25" fill="#186587"/><text x="142" y="1143" class="h" font-size="14" text-anchor="middle">AI</text><text x="184" y="1130" class="h" font-size="23">Ollama + embedding models</text><text x="184" y="1160" class="p" font-size="16">Local model and retrieval experiments on the T480.</text>
    <rect x="626" y="1090" width="480" height="135" rx="20" fill="url(#card)" stroke="#347e9b"/><circle cx="674" cy="1138" r="25" fill="#186587"/><text x="674" y="1143" class="h" font-size="12" text-anchor="middle">SAFE</text><text x="716" y="1130" class="h" font-size="23">Private by design</text><text x="716" y="1160" class="p" font-size="16">Loopback n8n; database and models on the Docker network.</text>
  </g>

  <rect x="60" y="1300" width="1080" height="510" rx="28" fill="#082b46" stroke="#2a84a0" stroke-width="2"/>
  <text x="96" y="1355" class="title" font-size="29">GOVERNED ADAPTERS — OPERATIONS WITH GUARDRAILS</text>
  <text x="96" y="1390" class="small" font-size="18">Fixed named operations only: no free-form remote shell, no secrets in Git, explicit approval for changes.</text>
  <rect x="96" y="1420" width="462" height="158" rx="20" fill="url(#strong)"/><text x="125" y="1461" class="h" font-size="22">T480 Control Adapter</text><rect x="396" y="1435" width="134" height="28" rx="14" fill="#6bf1dd"/><text x="463" y="1455" class="tag" font-size="12" text-anchor="middle">WINDOWS + WSL</text><text x="125" y="1495" class="p" font-size="16">Health, Docker diagnostics, AC power policy,</text><text x="125" y="1519" class="p" font-size="16">boot recovery, controlled reboot and maintenance checks.</text><text x="125" y="1551" class="small" font-size="14">Approval-gated: restart • startup task • power changes</text>
  <rect x="642" y="1420" width="462" height="158" rx="20" fill="url(#strong)"/><text x="671" y="1461" class="h" font-size="22">n8n Workflow Adapter</text><rect x="974" y="1435" width="102" height="28" rx="14" fill="#6bf1dd"/><text x="1025" y="1455" class="tag" font-size="12" text-anchor="middle">WORKFLOWS</text><text x="671" y="1495" class="p" font-size="16">Health, list, inspect, import, activate and test</text><text x="671" y="1519" class="p" font-size="16">bounded workflows through the local n8n API.</text><text x="671" y="1551" class="small" font-size="14">Approval-gated: import or activation of workflow changes</text>
  <rect x="96" y="1605" width="462" height="158" rx="20" fill="url(#strong)"/><text x="125" y="1646" class="h" font-size="22">Postgres + pgvector Adapter</text><rect x="393" y="1620" width="137" height="28" rx="14" fill="#6bf1dd"/><text x="462" y="1640" class="tag" font-size="12" text-anchor="middle">DATA LAYER</text><text x="125" y="1680" class="p" font-size="16">Readiness checks, vector probes, reviewed migrations</text><text x="125" y="1704" class="p" font-size="16">and evidence-backed synthetic recovery exercises.</text><text x="125" y="1736" class="small" font-size="14">Approval-gated: applying a reviewed migration</text>
  <rect x="642" y="1605" width="462" height="158" rx="20" fill="url(#strong)"/><text x="671" y="1646" class="h" font-size="22">Upgrade + Recovery Controls</text><rect x="960" y="1620" width="116" height="28" rx="14" fill="#ffcd72"/><text x="1018" y="1640" class="tag" font-size="12" text-anchor="middle">APPROVAL</text><text x="671" y="1680" class="p" font-size="16">Pinned images, pre-upgrade backup, health verification,</text><text x="671" y="1704" class="p" font-size="16">synthetic workflow test, host-side backup and restore.</text><text x="671" y="1736" class="small" font-size="14">Never auto-upgrade; retain a reviewable decision trail</text>

  <rect x="60" y="1845" width="1080" height="218" rx="28" fill="#082b46" stroke="#3bd5c7" stroke-width="2"/>
  <text x="96" y="1898" class="title" font-size="28">PROVEN OPERATING RHYTHM</text>
  <g><rect x="95" y="1930" width="205" height="84" rx="18" fill="#104a68"/><text x="198" y="1964" class="h" font-size="18" text-anchor="middle">1. INSPECT</text><text x="198" y="1990" class="small" font-size="14" text-anchor="middle">Health + capacity</text></g>
  <g><rect x="330" y="1930" width="205" height="84" rx="18" fill="#104a68"/><text x="432" y="1964" class="h" font-size="18" text-anchor="middle">2. APPROVE</text><text x="432" y="1990" class="small" font-size="14" text-anchor="middle">Bounded change</text></g>
  <g><rect x="565" y="1930" width="205" height="84" rx="18" fill="#104a68"/><text x="667" y="1964" class="h" font-size="18" text-anchor="middle">3. VERIFY</text><text x="667" y="1990" class="small" font-size="14" text-anchor="middle">Service + workflow</text></g>
  <g><rect x="800" y="1930" width="270" height="84" rx="18" fill="#104a68"/><text x="935" y="1964" class="h" font-size="18" text-anchor="middle">4. RETAIN EVIDENCE</text><text x="935" y="1990" class="small" font-size="14" text-anchor="middle">Bundles, hashes, milestone proof</text></g>

  <rect x="60" y="2095" width="1080" height="72" rx="22" fill="#0b5770" stroke="#6cefe0" stroke-width="2"/>
  <text x="600" y="2140" class="h" font-size="25" text-anchor="middle">LEARN FASTER  •  EXPERIMENT SAFELY  •  BUILD REUSABLE AI WORKFLOWS</text>
</svg>
