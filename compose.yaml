name: cs-ai-lab

services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:84a355869251af1a3379cfc9fa7b4dbf962c03f642a4bb7b339a203925071c43
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ./postgres/migrations:/lab-postgres/migrations:ro
    networks:
      - internal
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  n8n:
    image: n8nio/n8n:1.123.76@sha256:66b6bfd6716877591d9c21340250f44f842e6b03f97ccaed09b9f95e13cf5331
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      n8n_files_init:
        condition: service_completed_successfully
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_HOST}
      N8N_PROTOCOL: ${N8N_PROTOCOL}
      N8N_PORT: ${N8N_PORT}
      N8N_DIAGNOSTICS_ENABLED: ${N8N_DIAGNOSTICS_ENABLED}
      N8N_PERSONALIZATION_ENABLED: ${N8N_PERSONALIZATION_ENABLED}
      N8N_RUNNERS_ENABLED: ${N8N_RUNNERS_ENABLED:-true}
      NODE_FUNCTION_ALLOW_BUILTIN: ${NODE_FUNCTION_ALLOW_BUILTIN:-crypto}
      GENERIC_TIMEZONE: ${TZ}
      TZ: ${TZ}
    ports:
      - "${N8N_BIND_ADDRESS}:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - n8n_files:/home/node/.n8n-files
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # This one-shot service owns only the separate n8n_files volume. It lets the
  # non-root n8n process write deliberately generated local files there.
  n8n_files_init:
    image: n8nio/n8n:1.123.76@sha256:66b6bfd6716877591d9c21340250f44f842e6b03f97ccaed09b9f95e13cf5331
    user: "0:0"
    entrypoint: ["/bin/sh", "-c", "mkdir -p /home/node/.n8n-files && chown -R 1000:1000 /home/node/.n8n-files"]
    restart: "no"
    volumes:
      - n8n_files:/home/node/.n8n-files

  health_dashboard:
    image: n8nio/n8n:1.123.76@sha256:66b6bfd6716877591d9c21340250f44f842e6b03f97ccaed09b9f95e13cf5331
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HEALTH_DASHBOARD_PORT: 8080
      TZ: ${TZ}
    entrypoint: ["node", "/opt/health-dashboard/server.js"]
    ports:
      - "${HEALTH_DASHBOARD_BIND_ADDRESS:-0.0.0.0}:${HEALTH_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - ./monitoring/dashboard/server.js:/opt/health-dashboard/server.js:ro
      - ./monitoring/dashboard/output:/opt/health-dashboard/output:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Optional CPU-only local inference. Start deliberately with:
  # docker compose --profile ollama up -d
  ollama:
    image: ollama/ollama:0.11.11@sha256:cc0c8be7ac32636d0ee238d64185fd9cd1103cc2dccb9cc388a057b1ebc1234b
    profiles: ["ollama"]
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - internal
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  n8n_data:
  n8n_files:
  ollama_models:
