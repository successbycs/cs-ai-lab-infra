[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cs-ai-lab-t480-core"
version = "0.1.0"
description = "Governed T480 transport primitives for SuccessByCS applications"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["t480_core*"]
